#resource
bind r source-file ${XDG_CONFIG_HOME}/tmux/tmux.conf
#unbind default prefix and set to alt+a
unbind C-b
set-option -g prefix M-a
bind-key M-a send-prefix

#? unbinds Ctrl+R but this isnt anything by default
unbind C-r

set -g default-shell /bin/zsh
set -g mouse on

#clipboard
set -g set-clipboard on
set -g allow-passthrough on
#for clipboard 
set-window-option -g mode-keys vi


set -g xterm-keys on
set -s extended-keys on

set -g renumber-windows on #renumber on window deleting
set -g base-index 1
set -g pane-base-index 1
#binds
#overwrites the default behavior of asking for confirmation (i hope)
bind x kill-pane

run-shell "/home/davis/scripts/tmux-resurrect/resurrect.tmux"
